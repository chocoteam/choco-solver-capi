name: Build

on:
  push:
    branches: [ master ]
    tags: [ 'choco-solver-capi-*' ]
  pull_request:
  workflow_dispatch:

jobs:
  # The sources must compile with any JDK, not only with GraalVM: a GraalVM JDK ships
  # the org.graalvm.nativeimage module and hides a too old svm dependency (see #12)
  compile:
    name: Compile with a standard JDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - run: mvn -B package

  # Same toolchain and script as the pychoco CI
  native:
    name: Native library (${{ matrix.os }})
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '22'
          distribution: 'graalvm'
          cache: 'maven'
      - name: Build
        shell: bash
        run: sh build.sh
      - name: Check the library and its headers
        shell: bash
        run: |
          ls target/libchoco_capi.h target/graal_isolate.h
          test -n "$(ls target/libchoco_capi.so target/libchoco_capi.dylib target/choco_capi.dll 2>/dev/null)"

  # A release tag becomes a GitHub Release, whose notes are the message of the annotated tag
  release:
    name: GitHub Release
    needs: native
    if: startsWith(github.ref, 'refs/tags/choco-solver-capi-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag  # annotated tags only, see RELEASE.md
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file notes.md \
            --title "$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")"
